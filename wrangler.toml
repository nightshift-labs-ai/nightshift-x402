name = "nightshift-x402"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# secrets/vars (never commit values): wrangler secret put PAY_TO ; CDP_API_KEY_ID ; CDP_API_KEY_SECRET

# request log (route/status/UA only, no IPs) -> demand analytics; read via GET /_stats?k=<STATS_KEY secret>
[[durable_objects.bindings]]
name = "REQLOG"
class_name = "ReqLog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReqLog"]
